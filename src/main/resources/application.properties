spring.application.name=nyx-core

# Discord Configuration
discord.token=YOUR_DISCORD_TOKEN_HERE
guild.id=YOUR_GUILD_ID_HERE

# Channels
discord.channels.general=YOUR_CHANNEL_ID
discord.channels.alerts=YOUR_CHANNEL_ID
discord.channels.dashboard=YOUR_CHANNEL_ID

# Internal Config Paths (Relative to JAR)
config.commands.path=config/commands.json
config.hosts.path=config/hosts.json
config.dashboard.path=config/dashboard.json

# Logging
logging.file.name=logs/nyx-bot.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
